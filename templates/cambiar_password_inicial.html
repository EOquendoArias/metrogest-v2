<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroGest — Cambiar contraseña</title>
  <link rel="icon" type="image/png" href="/static/img/favicon_metrogest.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:#00132a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      background:white;
      border-radius:20px;
      padding:40px 38px 36px;
      width:100%;
      max-width:420px;
      box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.06);
    }
    .card-logo{
      display:flex;align-items:center;gap:10px;
      margin-bottom:28px;
      padding-bottom:22px;
      border-bottom:1px solid #f1f5f9;
    }
    .card-logo-icon{
      width:40px;height:40px;border-radius:10px;
      background:linear-gradient(135deg,#b45309,#92400e);
      display:flex;align-items:center;justify-content:center;
      font-size:18px;color:white;flex-shrink:0;
    }
    .card-title{font-size:20px;font-weight:800;color:#0f3460;margin-bottom:2px;}
    .card-sub{font-size:12px;color:#94a3b8;}
    .alert-warn{
      background:#fffbeb;border:1px solid #fde68a;color:#92400e;
      padding:11px 14px;border-radius:10px;font-size:13px;
      margin-bottom:20px;display:flex;align-items:center;gap:8px;
    }
    .alert-err{
      background:#fef2f2;border:1px solid #fecaca;color:#dc2626;
      padding:11px 14px;border-radius:10px;font-size:13px;
      margin-bottom:20px;display:flex;align-items:center;gap:8px;
    }
    .fg{margin-bottom:18px}
    label{
      display:block;font-size:10px;font-weight:800;color:#64748b;
      margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;
    }
    .iw{position:relative}
    .iw i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:13px;}
    input{
      width:100%;padding:13px 13px 13px 42px;
      border:1.5px solid #e8eef5;border-radius:10px;
      font-size:14px;color:#1e293b;background:#f8fafc;
      font-family:inherit;transition:all 0.18s;
    }
    input:focus{
      outline:none;border-color:#1a4f8a;background:white;
      box-shadow:0 0 0 3px rgba(26,79,138,0.1);
    }
    .btn{
      width:100%;padding:14px;
      background:linear-gradient(135deg,#1a4f8a,#0f3460);
      color:white;border:none;border-radius:10px;
      font-size:14px;font-weight:700;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:9px;
      margin-top:8px;transition:all 0.18s;letter-spacing:0.3px;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,79,138,0.35);}
    .btn:active{transform:translateY(0);}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-logo">
      <div class="card-logo-icon"><i class="fas fa-key"></i></div>
      <div>
        <div class="card-title">Cambio de contraseña obligatorio</div>
        <div class="card-sub">Por seguridad debes definir una contraseña propia</div>
      </div>
    </div>

    <div class="alert-warn">
      <i class="fas fa-triangle-exclamation"></i>
      Estás usando una contraseña temporal. Debes cambiarla antes de continuar.
    </div>

    {% if error %}
    <div class="alert-err"><i class="fas fa-circle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="post" action="/usuarios/cambiar-password-inicial">
      <div class="fg">
        <label>Nueva contraseña</label>
        <div class="iw">
          <i class="fas fa-lock"></i>
          <input type="password" name="nueva_password" required minlength="8"
                 placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>
      </div>
      <div class="fg">
        <label>Confirmar contraseña</label>
        <div class="iw">
          <i class="fas fa-lock"></i>
          <input type="password" name="confirmar_password" required minlength="8"
                 placeholder="Repite la contraseña" autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="btn">
        <i class="fas fa-check"></i> Guardar y continuar
      </button>
    </form>
  </div>
</body>
</html>
