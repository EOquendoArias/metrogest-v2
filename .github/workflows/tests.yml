name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: metrogest
          POSTGRES_PASSWORD: metrogest_ci
          POSTGRES_DB: metrogest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrogest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La app nunca corre contra esta URL — es la base de PRUEBA que la CI
      # crea y destruye en cada corrida (ver services.postgres arriba).
      TEST_DATABASE_URL: postgresql+psycopg2://metrogest:metrogest_ci@localhost:5432/metrogest_test
      # Comillas obligatorias y NO usar un valor solo de dígitos: YAML
      # interpreta un escalar sin comillas hecho solo de ceros como el
      # entero octal 0 (no como texto), y GitHub Actions lo pasa al proceso
      # como la variable de entorno SESSION_SECRET="0" (1 caracter) en vez
      # de los 68 ceros que se ven aquí. Eso hace que main.py (chequeo
      # `len(SESSION_SECRET) < 32`) aborte con sys.exit(1) al importar la
      # app — exactamente el bug real que rompía toda la suite de tests
      # que usan la fixture `client` (hallazgo del 13-ago-2026, ver
      # docs/PROJECT_PLAN.md). Verificado con `yaml.safe_load()`.
      SESSION_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef0123456789abcdef01"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pytest
        run: pytest tests/ -v
